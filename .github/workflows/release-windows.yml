name: Build and release Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.1"
        required: true
        type: string

# The workflow needs this permission only to create the GitHub Release and upload its EXE.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows EXE
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download FFmpeg for the release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $downloadUrl = "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-release-essentials.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $ffmpeg = Get-ChildItem -Path $extractPath -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractPath -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "The downloaded FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe."
          }

          New-Item -ItemType Directory -Path "assets/ffmpeg" -Force | Out-Null
          Copy-Item $ffmpeg.FullName "assets/ffmpeg/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "assets/ffmpeg/ffprobe.exe" -Force

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: pyinstaller build.spec --clean --noconfirm

      - name: Prepare named release file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "release"
          $releaseFile = "VideoCompressor-$env:RELEASE_TAG-windows-x64.exe"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "dist/VideoCompressor.exe" (Join-Path $releaseDir $releaseFile) -Force

          $file = Get-Item (Join-Path $releaseDir $releaseFile)
          if ($file.Length -lt 10MB) {
            throw "The generated EXE is unexpectedly small ($($file.Length) bytes)."
          }
          Write-Host "Release file: $($file.FullName), $([math]::Round($file.Length / 1MB, 1)) MB"

      - name: Create GitHub Release and upload EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseFile = Get-ChildItem "release/VideoCompressor-*-windows-x64.exe" | Select-Object -First 1
          gh release create "$env:RELEASE_TAG" $releaseFile.FullName --title "VideoCompressor $env:RELEASE_TAG" --generate-notes
