name: Build and release Windows EXE

# Every successful update pushed to main becomes a new Windows EXE release.
on:
  push:
    branches:
      - main

# Only creates one release at a time, so two quick updates do not mix files.
concurrency:
  group: windows-release-main
  cancel-in-progress: false

# Needed only to create the GitHub Release, its version tag, and upload the EXE.
permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and publish Windows EXE
    runs-on: windows-latest
    env:
      # GitHub increases this number automatically. No manual version entry is needed.
      RELEASE_TAG: v1.0.${{ github.run_number }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Download driver-compatible FFmpeg for the release package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Newer FFmpeg builds require NVENC API 13.0.  This fixed 7.1.1 build
          # is compatible with NVIDIA drivers exposing API 12.2, while still
          # providing H.264, AAC, and the platform-compatible yuv420p output.
          $downloadUrl = "https://github.com/GyanD/codexffmpeg/releases/download/7.1.1/ffmpeg-7.1.1-essentials_build.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "ffmpeg-7.1.1-essentials_build.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "ffmpeg"
          $expectedSha256 = "04861d3339c5ebe38b56c19a15cf2c0cc97f5de4fa8910e4d47e5e6404e4a2d4"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "FFmpeg 7.1.1 checksum verification failed."
          }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force

          $ffmpeg = Get-ChildItem -Path $extractPath -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $ffprobe = Get-ChildItem -Path $extractPath -Recurse -Filter "ffprobe.exe" | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) {
            throw "The downloaded FFmpeg archive did not contain ffmpeg.exe and ffprobe.exe."
          }

          New-Item -ItemType Directory -Path "assets/ffmpeg" -Force | Out-Null
          Copy-Item $ffmpeg.FullName "assets/ffmpeg/ffmpeg.exe" -Force
          Copy-Item $ffprobe.FullName "assets/ffmpeg/ffprobe.exe" -Force

      - name: Download native bitmap subtitle renderer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # HandBrake is used only for PGS/DVB/VobSub hard-burn. FFmpeg keeps
          # handling ordinary text subtitles, so the fast normal path is unchanged.
          $downloadUrl = "https://github.com/HandBrake/HandBrake/releases/download/1.11.2/HandBrakeCLI-1.11.2-win-x86_64.zip"
          $archivePath = Join-Path $env:RUNNER_TEMP "HandBrakeCLI-1.11.2-win-x86_64.zip"
          $extractPath = Join-Path $env:RUNNER_TEMP "handbrake"
          $expectedSha256 = "80bfe8d5f5d11cc3ef76b834add3ed4e82dee6523ffeb435c283f88b1a21f09d"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $archivePath
          $actualSha256 = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLower()
          if ($actualSha256 -ne $expectedSha256) {
            throw "HandBrakeCLI checksum verification failed."
          }
          Expand-Archive -Path $archivePath -DestinationPath $extractPath -Force
          $cli = Get-ChildItem -Path $extractPath -Recurse -Filter "HandBrakeCLI.exe" | Select-Object -First 1
          $copying = Get-ChildItem -Path $extractPath -Recurse -Filter "COPYING" | Select-Object -First 1
          $license = Get-ChildItem -Path $extractPath -Recurse -Filter "LICENSE" | Select-Object -First 1
          if (-not $cli -or -not $copying -or -not $license) {
            throw "The HandBrake archive did not contain HandBrakeCLI.exe and license files."
          }
          New-Item -ItemType Directory -Path "assets/handbrake" -Force | Out-Null
          Copy-Item $cli.FullName "assets/handbrake/HandBrakeCLI.exe" -Force
          Copy-Item $copying.FullName "assets/handbrake/COPYING" -Force
          Copy-Item $license.FullName "assets/handbrake/LICENSE" -Force

      - name: Run regression tests
        shell: pwsh
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Build EXE with PyInstaller
        shell: pwsh
        run: pyinstaller build.spec --clean --noconfirm

      - name: Prepare named release file
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $releaseDir = "release"
          $releaseFile = "VideoCompressor-$env:RELEASE_TAG-windows-x64.exe"
          New-Item -ItemType Directory -Path $releaseDir -Force | Out-Null
          Copy-Item "dist/VideoCompressor.exe" (Join-Path $releaseDir $releaseFile) -Force

          $file = Get-Item (Join-Path $releaseDir $releaseFile)
          if ($file.Length -lt 10MB) {
            throw "The generated EXE is unexpectedly small ($($file.Length) bytes)."
          }
          Write-Host "Release file: $($file.FullName), $([math]::Round($file.Length / 1MB, 1)) MB"

      - name: Create GitHub Release and upload EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $releaseFile = Get-ChildItem "release/VideoCompressor-*-windows-x64.exe" | Select-Object -First 1
          gh release view "$env:RELEASE_TAG" 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "$env:RELEASE_TAG" $releaseFile.FullName --clobber
          } else {
            gh release create "$env:RELEASE_TAG" $releaseFile.FullName --target "$env:GITHUB_SHA" --title "VideoCompressor $env:RELEASE_TAG" --generate-notes
          }
